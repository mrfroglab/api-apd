name: Sync to MrFrogLab

on:
  push:
    branches:
      - main
      - develop

jobs:
  sync:
    name: Mirror Branch to Org Repo
    runs-on: ubuntu-latest
    if: github.repository == 'januarsyah901/apd-api'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to mrfroglab
        run: |
          git remote add target https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/mrfroglab/api-apd.git
          git push target ${{ github.ref_name }} --force
